name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install pinned Inno Setup compiler
        run: ./scripts/install-inno.ps1
      - name: Package installer and portable ZIP
        run: ./scripts/package.ps1
      - name: Test install, upgrade, and uninstall
        run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StayAliveMC-windows-x64
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
